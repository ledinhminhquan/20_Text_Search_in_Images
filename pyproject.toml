[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imgtextsearch"
version = "1.0.0"
description = "Text Search within Images — search a collection by the text the images CONTAIN (OCR), with a trainable dense text retriever + BM25 + RRF, orchestrated by a deterministic agent (D1-D5) that verifies the literal term, shows the matching snippet, and abstains when no image contains the text"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Le Dinh Minh Quan" }]
keywords = ["nlp", "ocr", "image-text-search", "document-search", "retrieval", "bm25", "dense-retrieval", "agent"]

# Core deps only — the package, the SeedEngine offline OCR, the synthetic generator, the BM25 index,
# the metrics, the agent and the tests all run with just these (no torch / tesseract). Heavy ML / OCR /
# serving / report libs are extras, imported lazily.
dependencies = [
    "numpy>=1.23",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "Pillow>=9.5",
]

[project.optional-dependencies]
ml = ["torch>=2.1", "sentence-transformers>=2.7", "transformers>=4.40", "datasets>=2.18"]
ocr = ["pytesseract>=0.3.10", "PyMuPDF>=1.23"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "gradio>=4.0"]
report = ["reportlab>=4.0", "python-pptx>=0.6.23", "matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.4"]
all = [
    "torch>=2.1", "sentence-transformers>=2.7", "transformers>=4.40", "datasets>=2.18",
    "pytesseract>=0.3.10", "PyMuPDF>=1.23",
    "fastapi>=0.110", "uvicorn[standard]>=0.29", "gradio>=4.0",
    "reportlab>=4.0", "python-pptx>=0.6.23", "matplotlib>=3.7",
]

[project.scripts]
imgtextsearch = "imgtextsearch.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imgtextsearch = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
